<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mateusz Stańczyk">
    <title>Dzień Wszystkich Świętych</title>
    <link rel="stylesheet" href="znicz_style.css">
</head>
<body>

    <div class="container">
        <h1>Wszystkich Świętych</h1>
        <p>Śpieszmy się kochać ludzi, tak szybko odchodzą</p>
        
        <div class="clay-candle">
            <div class="fire-glow"></div>
            <div class="flame-wrapper">
                <div class="flame-core"></div>
                <div class="flame-gold"></div>
                <div class="flame-red"></div>
            </div>
            <div class="wick"></div>
            <div class="wax"></div>
            <div class="clay-pot">
                <div class="pot-rim"></div>
            </div>
            <div class="base-shadow"></div>
        </div>
    </div>

</body>
</html>
